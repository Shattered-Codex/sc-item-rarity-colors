<div class="scirc-preview-variant" data-preview-variant="tidy5e" hidden>
<div class="sc-item-rarity-colors__preview-label">Item Sheet</div>
<div class="mini-item-sheet mini-item-sheet--tidy">
  <div class="application sheet item tidy5e-sheet quadrone weapon themed" data-scirc-tidy-root>
    <header class="window-header">
      <div class="header-over-sidebar theme-dark">
        <span class="header-item-type-label truncate">Weapon</span>
      </div>
      <div class="item-header-start-document-name truncate">Mace</div>
    </header>
    <section class="window-content">
      <aside class="sidebar theme-dark">
        <div>
          <div class="item-image-container">
            <img class="item-image" src="icons/weapons/maces/mace-spiked-skull.webp" alt="Mace">
          </div>
          <div class="item-rarity-container"><div class="item-rarity-text" data-scirc-entry-label>Rarity</div></div>
        </div>
      </aside>
      <main class="item-content">
        <div class="item-name-wrapper flex-row extra-small-gap align-items-center">
          <div class="document-name">Mace</div>
        </div>
        <div class="subtitle">Simple Melee Weapon</div>
        <div class="item-header-summary">
          <div class="item-price">
            <i class="currency gp" aria-label="Gold"></i>
            <span class="item-price-number"><span class="color-text-default text-data">5</span> <span class="item-price-denomination color-text-lighter">gp</span></span>
          </div>
          <div class="item-weight">
            <i class="fas fa-weight-hanging item-weight-icon text-label-icon"></i>
            <span class="item-weight-value text-data">4</span>
            <span class="item-weight-unit color-text-lighter">lb</span>
          </div>
          <div class="item-quantity">
            <span class="item-quantity-label color-text-lighter">Quantity</span>
            <span class="item-quantity-value">1</span>
          </div>
        </div>
        <div role="tablist" class="tidy-tabs item-tabs">
          <a class="tab-option active first-tab" role="tab" aria-selected="true"><span class="tab-title">Description</span></a>
          <a class="tab-option" role="tab" aria-selected="false"><span class="tab-title">Details</span></a>
          <a class="tab-option" role="tab" aria-selected="false"><span class="tab-title">Activities</span></a>
          <a class="tab-option no-border-on-last-tab" role="tab" aria-selected="false"><span class="tab-title">Effects</span></a>
        </div>
        <hr class="golden-fade">
        <div class="tidy-tab description active" data-tab-contents-for="description" role="tabpanel" data-tidy-sheet-part="tab-content">
          <p>A heavy flanged mace, its head worn smooth by countless battles.</p>
          <section class="tidy-table" data-tidy-sheet-part="item-table">
            <header class="tidy-table-header-row theme-dark" data-tidy-sheet-part="table-header-row">
              <div class="tidy-table-header-cell header-label-cell primary" data-tidy-sheet-part="table-header-cell">
                <h3>Activities</h3>
                <span class="table-header-count">1</span>
              </div>
              <div class="tidy-table-header-cell" data-tidy-sheet-part="table-header-cell" style="--tidy-table-column-width: 5rem;">Uses</div>
            </header>
            <div class="item-table-body">
              <div class="tidy-table-row-container">
                <div class="tidy-table-row tidy-table-row-v2" data-tidy-table-row>
                  <a class="tidy-table-row-use-button"><img class="item-image" alt="Attack" src="icons/weapons/maces/mace-spiked-skull.webp"></a>
                  <div class="tidy-table-cell item-label text-cell primary" data-tidy-sheet-part="table-cell">
                    <a class="item-name" role="button">
                      <span class="cell-text">
                        <span class="cell-name">Attack</span>
                        <span class="cell-context">Action</span>
                      </span>
                    </a>
                  </div>
                  <div class="tidy-table-cell" data-tidy-sheet-part="table-cell" style="--tidy-table-column-width: 5rem;"><span class="color-text-disabled">&mdash;</span></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </section>
  </div>
</div>

<div class="sc-item-rarity-colors__preview-label">Inventory</div>
<div class="tidy-inventory-preview">
  <div class="application sheet actor character tidy5e-sheet quadrone themed" data-scirc-tidy-root>
    <section class="tidy-table" data-tidy-sheet-part="item-table">
      <header class="tidy-table-header-row theme-dark" data-tidy-sheet-part="table-header-row">
        <div class="tidy-table-header-cell header-label-cell primary" data-tidy-sheet-part="table-header-cell">
          <h3>Weapons</h3>
          <span class="table-header-count">1</span>
        </div>
        <div class="tidy-table-header-cell" data-tidy-sheet-part="table-header-cell" style="--tidy-table-column-width: 4rem;">Weight</div>
        <div class="tidy-table-header-cell" data-tidy-sheet-part="table-header-cell" style="--tidy-table-column-width: 4.5rem;">Quantity</div>
        <div class="tidy-table-header-cell" data-tidy-sheet-part="table-header-cell" style="--tidy-table-column-width: 4rem;">Price</div>
      </header>
      <div class="item-table-body">
        <div class="tidy-table-row-container" data-item-id="scirc-preview">
          <div class="tidy-table-row tidy-table-row-v2" data-tidy-table-row data-tidy-sheet-part="item-table-row">
            <a class="tidy-table-row-use-button">
              <img class="item-image" alt="Mace" src="icons/weapons/maces/mace-spiked-skull.webp">
              <span class="roll-prompt"><i class="fa-solid fa-dice-d20"></i></span>
            </a>
            <div class="tidy-table-cell item-label text-cell primary" data-tidy-sheet-part="table-cell">
              <a class="item-name" role="button">
                <span class="cell-text">
                  <span class="cell-name">Mace</span>
                  <span class="cell-context">Simple Melee</span>
                </span>
                <span class="row-detail-expand-indicator"><i class="fa-solid fa-angle-right expand-indicator"></i></span>
              </a>
            </div>
            <div class="tidy-table-cell" data-tidy-sheet-part="table-cell" style="--tidy-table-column-width: 4rem;"><span>4 <span class="color-text-lighter">lb</span></span></div>
            <div class="tidy-table-cell" data-tidy-sheet-part="table-cell" style="--tidy-table-column-width: 4.5rem;"><span class="item-quantity-value">1</span></div>
            <div class="tidy-table-cell" data-tidy-sheet-part="table-cell" style="--tidy-table-column-width: 4rem;"><div class="item-price"><span class="item-price-number"><span class="color-text-default text-data">5</span> <span class="item-price-denomination color-text-lighter">gp</span></span></div></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
</div>
